services:
    # default configuration for services in *this* file
    _defaults:
        # automatically injects dependencies in your services
        autowire: true
        # automatically registers your services as commands, event subscribers, etc.
        autoconfigure: true
        # this means you cannot fetch services directly from the container via $container->get()
        # if you need to do this, you can override this setting on individual services
        public: false

    # auto-register all commands as services
    Weblizards\CustomMaintenanceBundle\Command\:
        resource: '../../Command'
        tags: [ 'console.command' ]


    # controllers are imported separately to make sure they're public
    # and have a tag that allows actions to type-hint services
    Weblizards\CustomMaintenanceBundle\Controller\:
        resource: '../../Controller'
        public: true
        tags: ['controller.service_arguments']

    Weblizards\CustomMaintenanceBundle\Tools\Installer:
        public: true

    Weblizards\CustomMaintenanceBundle\Config:
        public: true

    Weblizards\CustomMaintenanceBundle\Infrastructure\Persistence\SettingsStorePersistenceAdapter: ~

    Weblizards\CustomMaintenanceBundle\Infrastructure\Persistence\LegacyPhpConfigAdapter: ~

    Weblizards\CustomMaintenanceBundle\Infrastructure\Persistence\PimcoreSettingsStoreGateway: ~

    Weblizards\CustomMaintenanceBundle\Infrastructure\Persistence\SettingsStoreGatewayInterface:
        alias: Weblizards\CustomMaintenanceBundle\Infrastructure\Persistence\PimcoreSettingsStoreGateway

    Weblizards\CustomMaintenanceBundle\Infrastructure\Persistence\ConfigPersistenceInterface:
        alias: Weblizards\CustomMaintenanceBundle\Infrastructure\Persistence\SettingsStorePersistenceAdapter

    Weblizards\CustomMaintenanceBundle\Infrastructure\Persistence\LegacyConfigLoaderInterface:
        alias: Weblizards\CustomMaintenanceBundle\Infrastructure\Persistence\LegacyPhpConfigAdapter

    Weblizards\CustomMaintenanceBundle\Service\MaintenanceConfigManager: ~

    Weblizards\CustomMaintenanceBundle\Service\StatusService:
        public: true
        arguments:
            $upcomingNoticeTemplate: '%weblizards_custom_maintenance.notice_template.upcoming%'
            $currentNoticeTemplate: '%weblizards_custom_maintenance.notice_template.current%'

    Weblizards\CustomMaintenanceBundle\Twig\Extensions:
        public: true
        tags:
            - { name: twig.extension }
