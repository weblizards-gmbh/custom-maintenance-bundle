<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wartungsarbeiten</title>
    <style>
        :root {
            color-scheme: light;
            --background: #f4efe6;
            --surface: #fffdf8;
            --text: #1f2933;
            --muted: #52606d;
            --border: #d9cbb6;
            --accent: #9f5f2e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            background:
                radial-gradient(circle at top right, rgba(159, 95, 46, 0.14), transparent 28rem),
                linear-gradient(180deg, #fbf8f2 0%, var(--background) 100%);
            color: var(--text);
            display: grid;
            place-items: center;
            padding: 1.5rem;
        }

        main {
            width: min(100%, 42rem);
            background: rgba(255, 253, 248, 0.96);
            border: 1px solid var(--border);
            border-radius: 1.25rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 1rem 3rem rgba(31, 41, 51, 0.08);
        }

        .eyebrow {
            margin: 0 0 0.75rem;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--accent);
        }

        h1 {
            margin: 0 0 1rem;
            font-size: clamp(2rem, 4vw, 3.1rem);
            line-height: 1.05;
        }

        p {
            margin: 0;
            font-size: 1.06rem;
            line-height: 1.7;
            color: var(--muted);
        }

        p + p {
            margin-top: 1rem;
        }

        .panel {
            margin-top: 1.5rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border);
        }

        @media (max-width: 40rem) {
            main {
                padding: 2rem 1.4rem;
            }

            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
<main>
    <p class="eyebrow">Vorübergehend nicht verfügbar</p>
    <h1>Wartungsarbeiten</h1>
    <p>Diese Anwendung ist wegen geplanter Wartungsarbeiten im Moment nicht erreichbar.</p>
    <p class="panel">Bitte versuchen Sie es in Kürze erneut. Vielen Dank für Ihr Verständnis.</p>
</main>
</body>
</html>
